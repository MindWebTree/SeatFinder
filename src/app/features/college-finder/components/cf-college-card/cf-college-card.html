<div
  class="bg-surface border border-white/5 rounded-xl p-4 flex flex-col gap-3 hover:border-primary/20 hover:bg-white/[0.02] transition-colors group">

  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <h3 class="text-slate-100 font-medium leading-snug group-hover:text-white transition-colors">
        {{ item().collegeName }}
      </h3>
      <p class="text-slate-400 text-sm mt-0.5 flex items-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 shrink-0" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        {{ item().city }}, {{ item().stateName }}
      </p>
    </div>

    <div class="shrink-0 text-right">
      <p class="text-primary font-semibold text-base">{{ item().seats }}</p>
      <p class="text-slate-500 text-[11px]">seat{{ item().seats === 1 ? '' : 's' }}</p>
    </div>
  </div>

  <!-- Course name -->
  <p class="text-xs text-slate-400 leading-relaxed -mt-1 line-clamp-2">
    {{ item().courseName }}
  </p>

  <!-- Chips row + action -->
  <div class="flex items-center justify-between gap-2 flex-wrap">
    <div class="flex flex-wrap gap-1.5 text-xs">
      <span class="px-2 py-0.5 rounded" [class]="categoryChip()">{{ item().category }}</span>
      <span class="px-2 py-0.5 rounded" [class]="statusChip()">{{ item().nmcStatus }}</span>
      <span class="px-2 py-0.5 rounded bg-slate-500/10 text-slate-400">{{ item().courseShortName }}</span>
    </div>

    <button type="button" (click)="onViewDetail()"
      class="text-xs text-slate-500 hover:text-primary flex items-center gap-1 transition-colors shrink-0">
      Details
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"
        stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>

  <!-- University -->
  <p class="text-[11px] text-slate-600 -mt-1 leading-relaxed line-clamp-1">{{ item().university }}</p>

</div>
