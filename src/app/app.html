<main class="min-h-screen bg-ink pb-20">
  <router-outlet />
</main>

<!-- Bottom Tab Bar -->
<nav class="fixed bottom-0 inset-x-0 z-30 bg-surface border-t border-white/8 safe-area-bottom">
  <div class="flex items-stretch max-w-3xl mx-auto">

    <!-- Colleges tab -->
    <a routerLink="/colleges" routerLinkActive="tab-active" [routerLinkActiveOptions]="{ exact: true }"
      class="tab-item flex-1 flex flex-col items-center justify-center gap-1 py-2.5 text-slate-500 hover:text-slate-300 transition-colors relative">
      <svg xmlns="http://www.w3.org/2000/svg" class="tab-icon w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
      </svg>
      <span class="tab-label text-[10px] font-medium tracking-wide leading-none">Colleges</span>
    </a>

    <!-- Seats tab -->
    <a routerLink="/" routerLinkActive="tab-active" [routerLinkActiveOptions]="{ exact: true }"
      class="tab-item flex-1 flex flex-col items-center justify-center gap-1 py-2.5 text-slate-500 hover:text-slate-300 transition-colors relative">
      <svg xmlns="http://www.w3.org/2000/svg" class="tab-icon w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
      </svg>
      <span class="tab-label text-[10px] font-medium tracking-wide leading-none">Seats</span>
    </a>

  </div>
</nav>
